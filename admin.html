<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal | Wallbinet</title>
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/images/logo.jpg" alt="Wallbinet Logo" />
        <span>WALLBINET ADMIN</span>
      </a>
      <a href="index.html" class="btn btn-outline">View Storefront</a>
    </div>
  </header>

  <main class="container" style="padding:48px 20px;">
    <!-- Private Passcode Gate (No Demo Account) -->
    <div id="adminLoginCard" class="card" style="max-width:420px; margin:40px auto;">
      <h2 style="margin-bottom:8px;">Administrator Access</h2>
      <p style="color:#5C6064; font-size:0.92rem; margin-bottom:18px;">
        Enter your administrator passcode to manage orders and update shipment locations.
      </p>
      <form id="adminAuthForm">
        <div class="form-group">
          <label>Admin Passcode</label>
          <input type="password" id="adminPassInput" class="form-control" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Unlock Dashboard</button>
        <p id="adminAuthError" style="color:var(--color-danger); font-size:0.88rem; margin-top:10px; display:none;">
          Incorrect passcode.
        </p>
      </form>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h2>Customer Orders &amp; Tracking Updates</h2>
        <button type="button" id="adminLogoutBtn" class="btn btn-outline">Lock Session</button>
      </div>
      <div id="adminOrdersList"></div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
